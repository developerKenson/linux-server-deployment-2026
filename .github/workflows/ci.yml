name: Linux Server CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Validate HTML structure
        run: |
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          grep -qi "<title>" index.html

      - name: CI success message
        run: echo "All website tests passed!"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t linux-server-website:v1 .

      - name: Verify Docker image
        run: docker image inspect linux-server-website:v1

  deploy:
    name: Deploy Website to AWS EC2
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -t ed25519 -H "$EC2_HOST" > ~/.ssh/known_hosts

          EXPECTED="SHA256:jnLztH7zyY1ANoWmuNac8xVms483igssZaqj6J/1NJ4"
          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')

          echo "$ACTUAL" | grep -Fx "$EXPECTED"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
              set -e

              cd /home/ubuntu/linux-server-deployment-2026

              git fetch origin main
              git reset --hard origin/main

              sudo docker build -t linux-server-website:v1 .

              sudo docker rm -f linux-website || true

              sudo docker run -d \
                --restart unless-stopped \
                --name linux-website \
                -p 8080:80 \
                linux-server-website:v1

              for attempt in $(seq 1 15); do
                if curl -fsS --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
                  echo "Website health check passed!"
                  break
                fi

                echo "Waiting for Nginx... attempt $attempt/15"
                sleep 2

                if [ "$attempt" -eq 15 ]; then
                  sudo docker logs --tail 50 linux-website
                  exit 1
                fi
              done

              echo "Deployment successful!"
          REMOTE
