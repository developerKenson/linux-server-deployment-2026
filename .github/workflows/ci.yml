
name: Linux Server CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Validate HTML structure
        run: |
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          grep -qi "<title>" index.html

      - name: CI success message
        run: echo "All website tests passed!"
